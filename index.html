<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#fff0d9">
<title>密室大逃脱 · 30 关</title>
<style>
:root{--ink:#4a3560;--ink2:#7d6b91;--pink:#ff6fa5;--pink2:#ffd6e6;--purple:#8e6bff;--purple2:#ebe4ff;--mint:#22b88a;--mint2:#d4f6ea;--sun:#ffc23c;--sun2:#fff1c7;--sky:#4d9bff;--sky2:#dcecff;--coral:#ff7b6b;--card:#fff;--r:20px;--shadow:0 6px 18px rgba(120,80,160,.13)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;overflow-x:hidden}
body{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC","Source Han Sans SC",sans-serif;color:var(--ink);background:linear-gradient(165deg,#fff0d9 0%,#ffe6f1 45%,#e6f0ff 100%) fixed;-webkit-user-select:none;user-select:none;overscroll-behavior-y:auto}
button{font-family:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation;background:none}
button:focus-visible{outline:3px solid var(--purple);outline-offset:2px}
h1,h2,h3,p{margin:0}
.screen{display:none;min-height:100vh;min-height:100dvh}
.screen.active{display:block;animation:fadein .25s ease}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.wrap{max-width:1040px;margin:0 auto;padding:12px 14px 28px}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:14px}
.btn{border-radius:16px;padding:12px 18px;font-size:17px;font-weight:800;background:#fff;box-shadow:0 4px 0 rgba(74,53,96,.13);transition:transform .08s;min-height:48px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(74,53,96,.13)}
.btn.primary{background:linear-gradient(180deg,#ff8dba,#ff5d98);color:#fff;box-shadow:0 5px 0 #d94a80}
.btn.purple{background:linear-gradient(180deg,#a68bff,#7f5cff);color:#fff;box-shadow:0 5px 0 #6243d6}
.btn.mint{background:linear-gradient(180deg,#46d6aa,#1fb185);color:#fff;box-shadow:0 5px 0 #188d69}
.btn.sun{background:linear-gradient(180deg,#ffd76a,#ffb820);color:#6b4a00;box-shadow:0 5px 0 #d99500}
.btn.ghost{background:rgba(255,255,255,.75)}
.btn.coral{background:linear-gradient(180deg,#ff9a8b,#ff6b5a);color:#fff;box-shadow:0 5px 0 #d94a3a}
.btn[disabled]{opacity:.45;pointer-events:none}
.iconbtn{width:46px;height:46px;border-radius:15px;background:rgba(255,255,255,.88);display:inline-flex;align-items:center;justify-content:center;box-shadow:0 3px 0 rgba(74,53,96,.1);font-size:22px;flex:none}
.tag{display:inline-block;font-size:12px;font-weight:800;padding:3px 9px;border-radius:999px;background:var(--purple2);color:#6a4bd8;white-space:nowrap}
.tag.pink{background:var(--pink2);color:#d63e7a}.tag.mint{background:var(--mint2);color:#138a66}.tag.sun{background:var(--sun2);color:#a8740a}
.stars{display:inline-flex;gap:2px;vertical-align:middle}.stars svg{width:18px;height:18px}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;padding:10px 12px;background:rgba(255,246,236,.92);backdrop-filter:blur(6px);box-shadow:0 2px 10px rgba(120,80,160,.08)}
.topbar .ttl{flex:1;min-width:0;font-size:18px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .ttl small{display:block;font-size:12px;font-weight:700;color:var(--ink2)}
.hintbtn{height:46px;border-radius:15px;padding:0 12px;background:linear-gradient(180deg,#ffe58a,#ffc93c);box-shadow:0 3px 0 #dba21a;font-weight:900;font-size:16px;display:inline-flex;align-items:center;gap:4px;flex:none}
.home-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:6px 2px 4px}
.logo{font-size:28px;font-weight:900;letter-spacing:1px;background:linear-gradient(90deg,#ff5d98,#8e6bff 60%,#4d9bff);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--ink2);font-size:14px;margin-top:2px}
.starpill{display:inline-flex;align-items:center;gap:4px;background:#fff;border-radius:999px;padding:6px 12px;font-weight:900;box-shadow:var(--shadow)}
.starpill svg{width:20px;height:20px}
.mascot{display:flex;align-items:center;gap:10px;margin:12px 0}
.mascot .face{font-size:46px;flex:none;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-5px)}}
.bubble{background:#fff;border-radius:16px;padding:10px 14px;font-size:15px;box-shadow:var(--shadow);position:relative;line-height:1.5}
.prog-banner{background:linear-gradient(135deg,#ff9a6b,#ff5d98);color:#fff;border-radius:20px;padding:14px 16px;box-shadow:0 6px 0 rgba(0,0,0,.12),var(--shadow);margin-bottom:14px}
.prog-banner b{font-size:22px;display:block}
.prog-banner span{font-size:14px;opacity:.95}
.list-intro{margin:4px 2px 12px;color:var(--ink2);font-size:14px;line-height:1.5}
.chapters{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}
.big-grid{display:grid;grid-template-columns:1fr;gap:10px}
@media(min-width:700px){.big-grid{grid-template-columns:1fr 1fr}}
@media(min-width:1000px){.big-grid{grid-template-columns:1fr 1fr 1fr}}
.room-list-hint{text-align:center;font-size:13px;font-weight:800;color:#a14d72;margin:0 0 8px;line-height:1.4}
.room-list-panel{padding:6px 4px 28px;margin:0 -2px 4px;border-radius:18px;background:rgba(255,255,255,.42)}
.room-list-panel .big{touch-action:pan-y}
.room-list-panel::-webkit-scrollbar{width:8px}
.room-list-panel::-webkit-scrollbar-thumb{background:#e0c4d4;border-radius:8px}
.big{display:flex;align-items:center;gap:12px;background:#fff;border-radius:18px;padding:10px 12px;box-shadow:0 4px 0 rgba(74,53,96,.1);text-align:left;min-height:72px;width:100%}
.big .bi{font-size:32px;width:54px;height:54px;border-radius:16px;background:var(--sun2);display:flex;align-items:center;justify-content:center;flex:none}
.big b{font-size:17px;display:block}
.big small{display:block;color:var(--ink2);font-size:12px;margin-top:2px}
.big .r{margin-left:auto;text-align:right;flex:none}
.big.locked{opacity:.55}
.big.locked .bi{filter:grayscale(1)}
.home-foot{margin-top:16px;text-align:center;color:var(--ink2);font-size:13px;line-height:1.6}
.home-reset{margin:10px 0 12px;display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
.home-reset .btn{min-height:44px;padding:10px 14px;font-size:14px;border:2px dashed #e0c4d4;background:#fff7fb;color:#a14d72;box-shadow:none}
.mask{position:fixed;inset:0;background:rgba(60,40,80,.38);z-index:50;display:none;align-items:flex-end;justify-content:center}
.mask.show{display:flex;animation:fadein .2s}
.sheet{background:#fffaf4;width:100%;max-width:560px;max-height:88vh;max-height:88dvh;overflow:auto;border-radius:26px 26px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom));box-shadow:0 -8px 30px rgba(0,0,0,.15)}
@media(min-width:700px){.mask{align-items:center}.sheet{border-radius:26px}}
.sheet-h{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.sheet-h h3{flex:1;font-size:20px;font-weight:900}
.xbtn{width:42px;height:42px;border-radius:14px;background:#f1e9f7;font-size:20px;font-weight:900;flex:none}
.say{font-size:16px;line-height:1.65}
.note{margin:10px 0;background:#fffdf0;border:2px dashed #e6cf8a;border-radius:14px;padding:12px 14px;font-size:16px;line-height:1.75;white-space:pre-line;color:#5b4636}
.banner{background:var(--mint2);color:#11795a;border-radius:14px;padding:10px 12px;font-weight:800;font-size:15px;margin-bottom:10px;line-height:1.5}
.banner.bad{background:#ffe3df;color:#c0392b}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.actions .btn{flex:1;min-width:120px}
.gnote{font-size:13px;color:var(--ink2);line-height:1.5;margin:6px 0}
.lock{margin-top:12px;background:#fff;border-radius:18px;padding:12px;box-shadow:inset 0 0 0 2px #f0e6f7}
.lock-p{font-size:14px;color:var(--ink2);font-weight:700;text-align:center;margin-bottom:8px}
.codebox{display:flex;justify-content:center;gap:8px;margin-bottom:10px}
.codebox span{width:46px;height:54px;border-radius:12px;background:#f6f1fb;border:3px solid #e2d6f0;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:900;color:var(--ink)}
.codebox span.f{border-color:var(--purple);background:#fff}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:330px;margin:0 auto}
.pad button,.kb button{background:#f6f1fb;border-radius:14px;min-height:50px;font-size:22px;font-weight:900;box-shadow:0 3px 0 #e2d6f0}
.pad button:active,.kb button:active{transform:translateY(2px);box-shadow:none}
.kb{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;max-width:420px;margin:0 auto}
.kb button{min-height:46px;font-size:19px}
.dials{display:flex;justify-content:center;gap:16px}
.dial{display:flex;flex-direction:column;align-items:center;gap:6px}
.dial .ch{width:68px;height:72px;border-radius:16px;background:#fff7e0;border:3px solid #f1c75b;display:flex;align-items:center;justify-content:center;font-size:38px;font-weight:900;font-family:"Noto Serif CJK SC","Songti SC",serif}
.dial button{width:68px;height:44px;border-radius:12px;background:#f6f1fb;font-size:20px;box-shadow:0 3px 0 #e2d6f0}
.choices{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}
.choices button{width:66px;height:66px;border-radius:16px;box-shadow:0 4px 0 rgba(0,0,0,.18);border:3px solid rgba(255,255,255,.7)}
.lock .ok{width:100%;margin-top:10px}
.room-wrap{max-width:1040px;margin:0 auto;padding:10px 12px 24px;display:grid;gap:10px}
@media(min-width:900px){.room-wrap{grid-template-columns:1.7fr 1fr;align-items:start}}
.scene-box{background:#fff;border-radius:20px;box-shadow:var(--shadow);overflow:hidden;line-height:0;position:relative}
#scene{width:100%;height:auto;display:block;aspect-ratio:4/3}
#scene .obj,#scene .hit{cursor:pointer}
#scene .obj:hover{filter:brightness(1.06)}
#scene .hl{fill:none;stroke:#ffcf00;stroke-width:4;stroke-dasharray:8 6;animation:dash 1s linear infinite;pointer-events:none}
@keyframes dash{to{stroke-dashoffset:-28}}
.msg{background:#fff;border-radius:16px;padding:12px 14px;font-size:15px;line-height:1.6;box-shadow:var(--shadow);min-height:52px}
.inv-h{display:flex;align-items:center;justify-content:space-between;font-weight:900;font-size:15px;margin:2px 4px}
.inv-h small{font-weight:700;color:var(--ink2);font-size:12px}
.inv{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.slot{background:rgba(255,255,255,.75);border-radius:14px;min-height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;border:3px solid transparent;padding:4px 2px;box-shadow:0 3px 0 rgba(74,53,96,.08)}
.slot .ic{font-size:28px;line-height:1.1}
.slot .nm{font-size:11px;font-weight:700;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.slot.empty{background:rgba(255,255,255,.35);box-shadow:none}
.slot.sel{border-color:var(--pink);background:#fff1f7;transform:translateY(-3px)}
.slot.glow .ic{filter:drop-shadow(0 0 6px #ffd23f)}
.side{display:flex;flex-direction:column;gap:10px}
.room-tools{display:flex;gap:8px}
.room-tools .btn{flex:1;font-size:15px;min-height:44px;padding:8px}
.story p{font-size:16px;line-height:1.75;margin-bottom:6px}
.win{text-align:center}
.win .wt{font-size:24px;font-weight:900;margin:6px 0}
.win .bigstars{display:flex;justify-content:center;gap:8px;margin:8px 0}
.win .bigstars svg{width:56px;height:56px;transform:scale(0);animation:pop .4s ease forwards}
.win .bigstars svg:nth-child(2){animation-delay:.2s}.win .bigstars svg:nth-child(3){animation-delay:.4s}
@keyframes pop{70%{transform:scale(1.2)}to{transform:scale(1)}}
.win .ws{color:var(--ink2);font-size:14px;margin-bottom:8px}
.explain{text-align:left;background:#fff;border-radius:16px;padding:12px 14px;margin-top:10px;box-shadow:inset 0 0 0 2px #efe6f7}
.explain h4{margin:0 0 6px;font-size:16px}
.explain ol{margin:0;padding-left:22px;font-size:15px;line-height:1.7}
.ending{background:var(--sun2);border-radius:14px;padding:10px 12px;font-size:15px;line-height:1.6;margin-top:10px;text-align:left}
.hint-list{display:flex;flex-direction:column;gap:8px}
.hint-item{background:#fff7d6;border-radius:14px;padding:10px 12px;font-size:16px;line-height:1.6}
.hint-item b{color:#a8740a}
.hint-cost{font-size:13px;color:var(--ink2);margin-top:8px;text-align:center}
#toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,30px);background:rgba(74,53,96,.94);color:#fff;padding:12px 18px;border-radius:16px;font-size:15px;font-weight:700;z-index:80;opacity:0;pointer-events:none;transition:.25s;max-width:calc(100vw - 32px);text-align:center;line-height:1.5}
#toast.show{opacity:1;transform:translate(-50%,0)}
.confetti{position:fixed;top:-20px;width:10px;height:14px;z-index:90;pointer-events:none;animation:fall linear forwards;border-radius:2px}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<!-- 首页：进度 + 章节 + 房间列表 -->
<section class="screen active" id="scr-home"><div class="wrap">
  <div class="home-head"><div><div class="logo">密室大逃脱</div><div class="sub">30 关 · 语文 · 数学 · 英语</div></div>
    <div style="display:flex;gap:8px;align-items:center"><span class="starpill" id="homeStars"></span><button class="iconbtn" data-act="mute" aria-label="声音开关"></button></div></div>
  <div class="mascot"><div class="face">🦉</div><div class="bubble" id="owlSay">每个房间都有一个小故事。找线索、拿物品、解密码，逃出去吧！</div></div>
  <div class="prog-banner"><b id="progText">已逃出 0 / 30 间</b><span>每 10 间为一章，通关上一章才能开下一章</span></div>
  <p class="list-intro" id="listIntro">点房间里的东西仔细看看，把物品拿起来、组合起来，解开密码锁逃出去！</p>
  <div id="listBody"></div>
  <div class="home-foot">进度保存在本页专用存档（与「解谜大冒险」互不影响）· 卡住了就点「💡 提示」</div>
</div></section>
<!-- 密室 -->
<section class="screen" id="scr-room">
  <div class="topbar"><button class="iconbtn" data-act="back" aria-label="返回">←</button><div class="ttl" id="roomTitle"></div><button class="hintbtn" data-act="hint">💡 提示</button><button class="iconbtn" data-act="mute" aria-label="声音开关"></button></div>
  <div class="room-wrap">
    <div class="scene-box"><svg id="scene" viewBox="0 0 400 300" role="img" aria-label="房间场景"></svg></div>
    <div class="side">
      <div class="msg" id="roomMsg"></div>
      <div class="inv-h">🎒 物品栏 <small id="invTip">点物品可以选中它</small></div>
      <div class="inv" id="inv"></div>
      <div class="room-tools"><button class="btn ghost" data-act="story">📖 看故事</button><button class="btn ghost" data-act="roomReset">🔄 重新开始</button></div>
    </div>
  </div>
</section>
<div class="mask" id="mask"><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div id="toast"></div>
<script>
/*ENGINE-START*/
(function(G){
'use strict';
var E={};
/* ================= 密室逃脱 ================= */
function has(st,i){return st.inv.indexOf(i)>=0;}
function cond(st,c){var neg=c[0]==='!';if(neg)c=c.slice(1);var v=c.indexOf('has:')===0?has(st,c.slice(4)):!!st.flags[c];return neg?!v:v;}
function condAll(st,list){return !list||list.every(function(c){return cond(st,c);});}
var R={
  init:function(){return {flags:{},inv:[],done:false};},
  obj:function(room,id){for(var i=0;i<room.objects.length;i++)if(room.objects[i].id===id)return room.objects[i];return null;},
  view:function(room,st,id){var o=R.obj(room,id);if(!o)return null;for(var i=0;i<o.views.length;i++)if(condAll(st,o.views[i].if))return o.views[i];return null;},
  apply:function(st,eff){(eff.take||[]).forEach(function(i){var k=st.inv.indexOf(i);if(k>=0)st.inv.splice(k,1);});
    (eff.give||[]).forEach(function(i){if(!has(st,i))st.inv.push(i);});(eff.set||[]).forEach(function(f){st.flags[f]=true;});
    if(eff.win){st.done=true;st.flags.escaped=true;}return {ok:true,text:eff.text||'',eff:eff};},
  look:function(room,st,id){var v=R.view(room,st,id);if(!v)return {ok:false,text:''};if(v.set)v.set.forEach(function(f){st.flags[f]=true;});return {ok:true,view:v,text:v.text};},
  take:function(room,st,id){var v=R.view(room,st,id);if(!v||!v.take)return {ok:false,text:'这里没有可以拿的东西。'};return R.apply(st,v.take);},
  norm:function(s){return String(s).toUpperCase().replace(/\s+/g,'');},
  code:function(room,st,id,code){var v=R.view(room,st,id);if(!v||!v.lock)return {ok:false,text:''};
    if(R.norm(code)===R.norm(v.lock.answer))return R.apply(st,v.lock.ok);return {ok:false,bad:true,text:v.lock.bad||'密码不对哦，再想一想。'};},
  use:function(room,st,id,item){if(!has(st,item))return {ok:false,text:''};var v=R.view(room,st,id);
    var u=v&&v.use?v.use.filter(function(x){return x.item===item;})[0]:null;
    if(!u)return {ok:false,text:(v&&v.wrong)||'好像用不上，换个东西试试吧。'};return R.apply(st,u);},
  combine:function(room,st,a,b){if(!has(st,a)||!has(st,b)||a===b)return {ok:false,text:''};
    var c=(room.combos||[]).filter(function(x){return (x.a===a&&x.b===b)||(x.a===b&&x.b===a);})[0];
    if(!c)return {ok:false,text:'这两样东西放在一起，好像没什么用。'};
    return R.apply(st,{take:[a,b],give:c.give,set:c.set,text:c.text});},
  hint:function(room,st){for(var i=0;i<room.hints.length;i++){var h=room.hints[i];if(!st.flags[h.until]&&condAll(st,h.if))return {idx:i,h:h};}return null;}
};
E.room=R;
G.PZE=E;
})(typeof window!=='undefined'?window:globalThis);
/*ENGINE-END*/
/*ROOMS-START*/
(function(G){
'use strict';
function R(x,y,w,h,f,rx,ex){return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="'+f+'"'+(rx?' rx="'+rx+'"':'')+(ex||'')+'/>';}
function T(x,y,s,ch,ex){return '<text x="'+x+'" y="'+y+'" font-size="'+s+'" text-anchor="middle" dominant-baseline="central"'+(ex||'')+'>'+ch+'</text>';}
function P(d,f,ex){return '<path d="'+d+'" fill="'+f+'"'+(ex||'')+'/>';}
function C(x,y,r,f,ex){return '<circle cx="'+x+'" cy="'+y+'" r="'+r+'" fill="'+f+'"'+(ex||'')+'/>';}
var SK=' stroke="#5b4636" stroke-width="2.5" stroke-linejoin="round"';
function g(id,inner){return '<g class="obj" data-obj="'+id+'">'+inner+'</g>';}
var ITEMS={
  torch:{name:'手电筒',icon:'🔦',desc:'一个手电筒，可是没有电池，按了不亮。'},
  battery:{name:'电池',icon:'🔋',desc:'两节电池，可以给东西供电。'},
  torch_on:{name:'亮着的手电筒',icon:'🔦',glow:1,desc:'装好电池的手电筒，能照亮黑乎乎的地方。'},
  doorkey:{name:'门钥匙',icon:'🗝️',desc:'书房门的钥匙。'},
  brush:{name:'毛笔',icon:'🖌️',desc:'一支干干的毛笔，要蘸墨才能用。'},
  ink:{name:'墨汁',icon:'🫙',desc:'一瓶黑黑的墨汁。'},

function resetAllProgress(){var sound=!!store.sound;store=defStore();store.sound=sound;save();}
function resetChapterProgress(c){var c0=c*CHAP,c1=Math.min(c0+CHAP,N);
  for(var i=c0;i<c1;i++){delete store.best['room:'+i];var id=ROOMS[i]&&ROOMS[i].id;if(id)delete store.rooms[id];}
  save();}
function chapterRangeLabel(c){var a=c*CHAP+1,b=Math.min((c+1)*CHAP,N);return '第 '+a+'-'+b+' 间';}
function openResetSheet(){var h=sheetHead('🗑 清空全部通关？');
  h+='<p class="say">会清空本页<strong>密室大逃脱</strong>全部章节的通关星星和半途进度，不能恢复。</p>';
  h+='<div class="note">声音开关会保留。清空后可以从第 1 关重新玩起。\n\n不会影响「解谜大冒险」里的进度。</div>';
  h+='<div class="actions"><button class="btn coral" data-act="resetAllYes">确认清空全部</button><button class="btn ghost" data-act="close">再想想</button></div>';
  openSheet(h);}
function openResetChapterSheet(){var lab=chapterRangeLabel(roomChapter);
  var h=sheetHead('🔄 重置本章？');
  h+='<p class="say">只清空当前选中的<strong>'+lab+'</strong>通关星星和半途进度，其他章节不受影响。</p>';
  h+='<div class="note">重置后，本章要从第一间重新逃出。如果后面章节因此还没解锁，需要先再通关本章。</div>';
  h+='<div class="actions"><button class="btn coral" data-act="resetChapterYes">确认重置本章</button><button class="btn ghost" data-act="close">再想想</button></div>';
  openSheet(h);}
/* ---------------- 页面切换 ---------------- */
var nav={screen:'home',idx:0};
function show(id){$$('.screen').forEach(function(s){s.classList.toggle('active',s.id==='scr-'+id);});nav.screen=id;window.scrollTo(0,0);}
function paintMute(){$$('[data-act="mute"]').forEach(function(b){b.textContent=store.sound?'🔊':'🔇';});}
var OWL=['每个房间都有一个小故事。找线索、拿物品、解密码，完成挑战吧！','小窍门：做题前先问问自己：“题目告诉了我什么？要我找什么？”','卡住了不要急，点「💡 提示」，我会一点一点帮你。','物品可以组合：先点一个再点另一个试试！','每 10 间通关后，下一章才会打开哦。'];
var roomChapter=0;
function renderHome(chap){if(chap!=null)roomChapter=chap;
  var tot=sumStars(),done=doneCount();
  $('#homeStars').innerHTML=starSvg(true)+tot+' / '+(N*3);
  $('#progText').textContent='已通关 '+done+' / '+N+' 间';
  $('#owlSay').textContent=OWL[done%OWL.length];
  var h='<div class="chapters">';
  var nc=Math.ceil(N/CHAP);
  for(var c=0;c<nc;c++){var a=c*CHAP+1,b=Math.min((c+1)*CHAP,N);
    h+='<button class="btn '+(roomChapter===c?'primary':'ghost')+'" data-act="chapter" data-c="'+c+'" style="min-height:40px;padding:8px 12px;font-size:14px">第 '+a+'-'+b+' 间</button>';}
  h+='</div>';
  h+='<div class="home-reset"><button class="btn" data-act="resetChapter" type="button">🔄 重置本章</button><button class="btn" data-act="resetProgress" type="button">🗑 清空全部通关</button></div>';
  h+='<div class="room-list-hint">↕ 往下滑动，本章 10 间都能看到；顶部可切换章节</div>';
  h+='<div class="room-list-panel"><div class="big-grid">';
  var c0=roomChapter*CHAP,c1=c0+CHAP;
  ROOMS.forEach(function(x,i){
    if(i<c0||i>=c1)return;
    var lock=!unlocked(i),b=bestOf(i);
    h+='<button class="big'+(lock?' locked':'')+'" data-act="play" data-i="'+i+'"><div class="bi">'+(lock?'🔒':x.emoji)+'</div><div style="min-width:0"><b>'+(i+1)+'. '+esc(x.title)+'</b><small>'+esc(x.sub)+'</small>'+
      (store.rooms[x.id]&&!b?'<small style="color:#d63e7a;font-weight:800">● 上次玩到一半</small>':'')+'</div><div class="r">'+(lock?'':starsHtml(b))+'</div></button>';});
  h+='</div></div>';
  $('#listBody').innerHTML=h;paintMute();show('home');}
function play(i,force){if(!unlocked(i)){SFX.bad();toast('先完成前一关，才能玩这一关哦！');return;}nav.idx=i;closeSheet(true);startRoom(i,force);paintMute();}
/* ---------------- 弹窗 ---------------- */
var sheetLocked=false,sheetOnClose=null;
function openSheet(html,opt){opt=opt||{};$('#sheet').innerHTML=html;$('#mask').classList.add('show');sheetLocked=!!opt.locked;sheetOnClose=opt.onClose||null;$('#sheet').scrollTop=0;}
function closeSheet(silent){var m=$('#mask');if(!m.classList.contains('show'))return;m.classList.remove('show');$('#sheet').innerHTML='';var f=sheetOnClose;sheetOnClose=null;sheetLocked=false;if(f&&!silent)f();}
function sheetHead(t){return '<div class="sheet-h"><h3>'+t+'</h3><button class="xbtn" data-act="close" aria-label="关闭">✕</button></div>';}
function hintSheet(H){var h=sheetHead('💡 提示');h+='<div class="hint-list">';
  if(!H.texts.length)h+='<div class="hint-item">需要帮忙吗？提示会一点一点给，先看第一条，想一想再看下一条。</div>';
  H.texts.forEach(function(t,i){h+='<div class="hint-item"><b>提示 '+(i+1)+'：</b>'+esc(t)+'</div>';});h+='</div>';
  var more=H.texts.length<H.max||H.repeat;
  h+='<div class="actions">'+(more?'<button class="btn sun" data-act="hintMore">'+(H.texts.length===0?'给我一点提示':H.texts.length<H.max?'再多一点提示':'再看下一步')+'</button>':'')+'<button class="btn ghost" data-act="close">我自己想想</button></div>';
  h+='<div class="hint-cost">用了提示，这一关的星星会少一点。没关系，学会最重要！</div>';
  openSheet(h);curHint=H;}
var curHint=null;
function hintMore(){var H=curHint;if(!H)return;var t=H.reveal(H.texts.length<H.max?H.texts.length:H.max-1);
  if(H.texts.length<H.max)H.texts.push(t);else H.texts[H.max-1]=t;SFX.hint();hintSheet(H);}
function winSheet(o){SFX.win();confetti();record(nav.idx,o.stars);
  var h='<div class="win"><div style="font-size:48px">'+(o.icon||'🎉')+'</div><div class="wt">'+o.title+'</div><div class="bigstars">'+[0,1,2].map(function(i){return starSvg(i<o.stars);}).join('')+'</div>';
  h+='<div class="ws">'+o.stat+'</div>';
  if(o.ending)h+='<div class="ending">'+esc(o.ending)+'</div>';
  if(o.explain&&o.explain.length)h+='<div class="explain"><h4>🦉 解谜思路</h4><ol>'+o.explain.map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ol></div>';
  var hasNext=nav.idx+1<N;
  h+='<div class="actions">'+(hasNext?'<button class="btn primary" data-act="next">下一关 ➜</button>':'')+'<button class="btn ghost" data-act="retry">再玩一次</button><button class="btn ghost" data-act="tolist">返回列表</button></div>';
  if(!hasNext)h+='<div class="hint-cost">🏆 30 间密室全部通关啦，太厉害了！</div>';
  h+='</div>';openSheet(h,{locked:true});}
function statLine(parts){return parts.filter(Boolean).join(' · ');}

/* ================= 密室逃脱 ================= */
var RP=null;
function startRoom(i,force){var room=ROOMS[i],saved=store.rooms[room.id];
  RP={room:room,i:i,st:E.room.init(),hints:0,stage:{},sel:null,hl:null,msg:'点房间里的东西，仔细看看吧！',started:Date.now()};
  if(saved&&!force){RP.st=saved.st;RP.hints=saved.hints||0;RP.stage=saved.stage||{};RP.msg='欢迎回来！接着上次的进度继续。';}
  $('#roomTitle').innerHTML=room.emoji+' '+esc(room.title)+'<small>第 '+(i+1)+' 间密室</small>';
  show('room');renderRoom();if(!saved||force)storySheet();}
function roomSave(){store.rooms[RP.room.id]={st:RP.st,hints:RP.hints,stage:RP.stage};save();}
function storySheet(){var r=RP.room;openSheet(sheetHead(r.emoji+' '+esc(r.title))+'<div class="story">'+r.story.map(function(p){return '<p class="say">'+esc(p)+'</p>';}).join('')+'</div><div class="note">玩法：点房间里的东西可以查看；看到「拿起」就把物品放进物品栏；先点物品栏里的物品选中它，再点房间里的东西就能“使用”；先后点两个物品可以“组合”。</div><div class="actions"><button class="btn primary" data-act="close">开始探险！</button></div>');}
function renderRoom(){var r=RP.room,st=RP.st,s=r.art(st.flags);
  r.objects.forEach(function(o){var b=o.box;s+='<rect class="hit" data-obj="'+o.id+'" x="'+b[0]+'" y="'+b[1]+'" width="'+b[2]+'" height="'+b[3]+'" fill="transparent"><title>'+esc(o.name)+'</title></rect>';});
  if(RP.hl){var o=E.room.obj(r,RP.hl);if(o){var b=o.box;s+='<rect class="hl" x="'+(b[0]-3)+'" y="'+(b[1]-3)+'" width="'+(b[2]+6)+'" height="'+(b[3]+6)+'" rx="10"/>';}}
  $('#scene').innerHTML=s;$('#roomMsg').innerHTML=esc(RP.msg);
  var h='',n=Math.max(5,st.inv.length);for(var i=0;i<n;i++){var it=st.inv[i];if(!it){h+='<div class="slot empty"></div>';continue;}var I=ITEMS[it];
    h+='<button class="slot'+(RP.sel===it?' sel':'')+(I.glow?' glow':'')+'" data-act="item" data-item="'+it+'"><span class="ic">'+I.icon+'</span><span class="nm">'+esc(I.name)+'</span></button>';}
  $('#inv').innerHTML=h;$('#invTip').textContent=RP.sel?'已选中「'+ITEMS[RP.sel].name+'」':'点物品可以选中它';}
function roomMsg(t){RP.msg=t;$('#roomMsg').innerHTML=esc(t);}
function roomAfter(res,objId){
  if(RP.hl&&E.room.hint(RP.room,RP.st)===null)RP.hl=null;
  var h=E.room.hint(RP.room,RP.st);if(RP.hl&&(!h||h.h.obj!==RP.hl))RP.hl=null;
  roomSave();renderRoom();if(RP.st.done){setTimeout(roomWin,700);}}
function roomTapObj(id){var r=RP.room,st=RP.st;if(st.done)return;
  if(RP.sel){var it=RP.sel,res=E.room.use(r,st,id,it);if(res.ok){SFX.unlock();RP.sel=null;roomMsg(res.text);toast(res.text,2600);roomAfter(res,id);}else{SFX.bad();roomMsg(res.text);toast(res.text);shake($('.scene-box'));}return;}
  SFX.tap();var lk=E.room.look(r,st,id);if(lk.view&&lk.view.set)roomSave();roomInspect(id);}
var LK=null;
function roomInspect(id,banner,bad){var r=RP.room,o=E.room.obj(r,id),v=E.room.view(r,RP.st,id);if(!v){closeSheet();return;}
  var h=sheetHead(esc(o.name));if(banner)h+='<div class="banner'+(bad?' bad':'')+'">'+esc(banner)+'</div>';
  h+='<p class="say">'+esc(v.text)+'</p>';if(v.note)h+='<div class="note">'+esc(v.note)+'</div>';
  if(v.use&&!v.take&&!v.lock)h+='<div class="gnote">💡 要在这里用东西：先关掉这个窗口，在物品栏选中物品，再点「'+esc(o.name)+'」。</div>';
  if(v.lock){var L=v.lock;if(!LK||LK.id!==id||LK.kind!==L.kind||LK.ans!==L.answer)LK={id:id,kind:L.kind,len:L.len||L.opts.length,val:'',dial:L.opts&&L.kind==='dial'?L.opts.map(function(){return 0;}):null,ans:L.answer};h+=lockHtml(L);}
  else LK=null;
  h+='<div class="actions">'+(v.take?'<button class="btn mint" data-act="take" data-obj="'+id+'">✋ 拿起</button>':'')+'<button class="btn ghost" data-act="close">'+(v.take?'先不拿':'好的')+'</button></div>';
  openSheet(h);RP.inspect=id;}
function lockHtml(L){var h='<div class="lock" id="lockBox"><div class="lock-p">🔒 '+esc(L.prompt||'输入密码')+'</div>';
  if(L.kind==='num'||L.kind==='alpha'){h+='<div class="codebox" id="codebox">'+codeCells()+'</div>';
    if(L.kind==='num'){h+='<div class="pad">';['1','2','3','4','5','6','7','8','9',L.dot?'.':'','0','⌫'].forEach(function(k){h+=k===''?'<span></span>':'<button data-act="'+(k==='⌫'?'bs':'key')+'" data-k="'+k+'">'+k+'</button>';});h+='</div>';}
    else{h+='<div class="kb">';'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').forEach(function(k){h+='<button data-act="key" data-k="'+k+'">'+k+'</button>';});h+='<button data-act="bs" data-k="⌫">⌫</button></div>';}
    h+='<button class="btn purple ok" data-act="lockok">确定</button>';}
  else if(L.kind==='dial'){h+='<div class="dials">';L.opts.forEach(function(o,i){h+='<div class="dial"><button data-act="dial" data-i="'+i+'" data-d="-1" aria-label="上一个">▲</button><div class="ch" id="dial'+i+'">'+o[LK.dial[i]]+'</div><button data-act="dial" data-i="'+i+'" data-d="1" aria-label="下一个">▼</button></div>';});h+='</div><button class="btn purple ok" data-act="lockok">确定</button>';}
  else if(L.kind==='choice'){h+='<div class="choices">';L.opts.forEach(function(o){h+='<button data-act="choice" data-v="'+o.v+'" style="background:'+o.c+'" aria-label="盒子"></button>';});h+='</div>';}
  return h+'</div>';}
function codeCells(){var s='';for(var i=0;i<LK.len;i++){var c=LK.val[i]||'';s+='<span class="'+(c?'f':'')+'">'+c+'</span>';}return s;}
function lockKey(k){if(!LK)return;SFX.tap();if(k==='⌫')LK.val=LK.val.slice(0,-1);else if(LK.val.length<LK.len)LK.val+=k;var cb=$('#codebox');if(cb)cb.innerHTML=codeCells();}
function lockDial(i,d){var v=E.room.view(RP.room,RP.st,LK.id),o=v.lock.opts[i];LK.dial[i]=(LK.dial[i]+d+o.length)%o.length;$('#dial'+i).textContent=o[LK.dial[i]];SFX.tap();}
function lockSubmit(val){var id=LK.id,v=E.room.view(RP.room,RP.st,id);if(val===undefined)val=v.lock.kind==='dial'?LK.dial.map(function(x,i){return v.lock.opts[i][x];}).join(''):LK.val;
  if((v.lock.kind==='num'||v.lock.kind==='alpha')&&val.length<1){toast('先输入密码哦');return;}
  var res=E.room.code(RP.room,RP.st,id,val);
  if(res.ok){SFX.unlock();LK=null;roomMsg(res.text);roomSave();if(RP.st.done){closeSheet(true);roomAfter(res,id);toast(res.text,2600);return;}roomAfter(res,id);roomInspect(id,res.text);}
  else{SFX.bad();if(LK.kind!=='dial')LK.val='';roomInspect(id,res.text,true);shake($('#lockBox'));}}
function roomTake(id){var res=E.room.take(RP.room,RP.st,id);if(!res.ok)return;SFX.pick();roomMsg(res.text);roomAfter(res,id);roomInspect(id,res.text);}
function roomTapItem(it){var st=RP.st;if(st.done)return;
  if(RP.sel===it){RP.sel=null;SFX.tap();roomMsg('「'+ITEMS[it].name+'」：'+ITEMS[it].desc);renderRoom();return;}
  if(RP.sel){var a=RP.sel,res=E.room.combine(RP.room,st,a,it);RP.sel=null;if(res.ok){SFX.unlock();roomMsg(res.text);toast(res.text);roomAfter(res);}else{SFX.bad();roomMsg(res.text);toast(res.text);renderRoom();}return;}
  RP.sel=it;SFX.pick();roomMsg('已选中「'+ITEMS[it].name+'」：'+ITEMS[it].desc+' 点房间里的东西来使用它，或者再点一个物品来组合。（再点一次可以放下）');renderRoom();}
function roomHint(){var hh=E.room.hint(RP.room,RP.st);if(!hh){toast('你已经快成功啦！');return;}var key=hh.idx;var texts=(RP.stage[key]||[]).slice();
  hintSheet({texts:texts,max:hh.h.tiers.length,reveal:function(i){RP.hints++;var arr=RP.stage[key]=RP.stage[key]||[];arr.push(hh.h.tiers[i]);if(i>=1&&hh.h.obj){RP.hl=hh.h.obj;}roomSave();renderRoom();return hh.h.tiers[i];}});}
function roomWin(){var r=RP.room,stars=RP.hints<=0?3:RP.hints<=3?2:1;delete store.rooms[r.id];save();
  winSheet({icon:'🚪',title:'挑战成功「'+r.title+'」！',stars:stars,ending:RP.msg,stat:statLine([RP.hints?'用了 '+RP.hints+' 次提示':'一次提示也没用，太棒了！']),explain:r.explain});}

/* ================= 事件 ================= */
document.addEventListener('click',function(ev){var t=ev.target;
  if(t.id==='mask'){if(!sheetLocked)closeSheet();return;}
  if(nav.screen==='room'){var ob=t.closest('#scene [data-obj]');if(ob){roomTapObj(ob.getAttribute('data-obj'));return;}}
  var b=t.closest('[data-act]');if(!b)return;var a=b.dataset.act;
  switch(a){
    case 'mute':store.sound=!store.sound;save();paintMute();if(store.sound)SFX.tap();break;
    case 'home':SFX.tap();closeSheet(true);renderHome();break;
    case 'chapter':SFX.tap();renderHome(+b.dataset.c);break;
    case 'back':SFX.tap();closeSheet(true);renderHome(Math.floor(nav.idx/CHAP));break;
    case 'play':SFX.tap();play(+b.dataset.i);break;
    case 'close':SFX.tap();closeSheet();break;
    case 'hint':SFX.tap();roomHint();break;
    case 'hintMore':hintMore();break;
    case 'next':closeSheet(true);play(nav.idx+1);break;
    case 'retry':closeSheet(true);play(nav.idx,true);break;
    case 'tolist':closeSheet(true);renderHome(Math.floor(nav.idx/CHAP));break;
    case 'item':roomTapItem(b.dataset.item);break;
    case 'take':roomTake(b.dataset.obj);break;
    case 'key':lockKey(b.dataset.k);break;
    case 'bs':lockKey('⌫');break;
    case 'dial':lockDial(+b.dataset.i,+b.dataset.d);break;
    case 'lockok':lockSubmit();break;
    case 'choice':lockSubmit(b.dataset.v);break;
    case 'story':SFX.tap();storySheet();break;
    case 'roomReset':SFX.tap();openSheet(sheetHead('🔄 重新开始？')+'<p class="say">房间会回到一开始的样子，物品栏也会清空。</p><div class="actions"><button class="btn primary" data-act="roomResetYes">重新开始</button><button class="btn ghost" data-act="close">不了</button></div>');break;
    case 'roomResetYes':closeSheet(true);delete store.rooms[RP.room.id];save();startRoom(RP.i,true);break;
    case 'resetProgress':SFX.tap();openResetSheet();break;
    case 'resetChapter':SFX.tap();openResetChapterSheet();break;
    case 'resetChapterYes':closeSheet(true);resetChapterProgress(roomChapter);SFX.ok();toast(chapterRangeLabel(roomChapter)+' 已重置！');renderHome();break;
    case 'resetAllYes':closeSheet(true);resetAllProgress();roomChapter=0;SFX.ok();toast('全部通关已清空，可以从头玩啦！');renderHome();break;
  }
});
document.addEventListener('keydown',function(e){if(e.key==='Escape'){if(!sheetLocked)closeSheet();}});
window.PZ={E:E,store:function(){return store;},room:function(){return RP;},nav:nav,play:play,unlocked:unlocked,bestOf:bestOf,resetAllProgress:resetAllProgress,resetChapterProgress:resetChapterProgress,renderHome:renderHome,KEY:KEY};
paintMute();renderHome();
})();
/*UI-END*/
</script>
</body>
</html>
